[advisories]
ignore = [
    # sqlx: TLS certificate verification disabled in debug builds (intentional for local dev)
    "RUSTSEC-2023-0071",

    # scc: RUSTSEC-2026-0205 — unsoundness in Array::insert if compare fn panics.
