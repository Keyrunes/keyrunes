# Fix available in spin 0.12.2 (not yanked), but upstream crates not yet compatible.
# KeyRunes does not use spin directly; only via tera, goose dev-dependency.
# Re-check: 2026-10-14 (90 days) — remove if lazy_static/flume bump spin.
[yanked]
enabled = false
