[package]
name = "keyrunes"
version = "0.4.0"
edition = "2024"
default-run = "keyrunes"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "macros", "postgres", "uuid", "chrono", "tls-rustls", "json", "migrate"] }
tera = { version = "2.4", features = ["glob_fs"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0.21"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }
argon2 = { version = "0.6", features = ["getrandom"] }
password-hash = "0.6"
uuid = { version = "1", features = ["serde", "v4"] }
anyhow = "1.0.104"
async-trait = "0.1"
rand = "0.10.3"
regex = "1"
tokio-stream = "0.1"
tower-http = { version = "0.7", features = ["fs", "cors"] }
url = "2.5"
dotenvy = "0.15.7"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_with = "3.24"
hex = "0.4.3"
futures = "0.3"
secrecy = { version = "0.10.3", features = ["serde"] }
tower = "0.5"
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls", "smtp-transport", "builder"] }
josekit = "0.10.3"
utoipa = { version = "6.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum"] }

[dev-dependencies]
test-case = "3.4.0"
rstest = "0.28.0"
proptest = "1.12"
tokio-test = "0.4"
fake = { version = "5.1", features = ["derive", "chrono", "uuid"] }
criterion = { version = "0.8", features = ["html_reports"] }
serial_test = "4.0"
goose = "0.18.1"
exhaustive = "0.2.2"
base64 = "0.23.1"
